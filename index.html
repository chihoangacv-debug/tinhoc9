<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CÙNG HỌC TIN HỌC 9 - NỀN TẢNG HỌC TẬP THÔNG MINH</title>
    <!-- Font Be Vietnam Pro chuẩn Tiếng Việt -->
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent-purple: #6366F1;
            --bg-gradient: linear-gradient(135deg, #E0E7FF 0%, #F1F5F9 50%, #E0F2FE 100%);
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.8);
            --text-main: #0F172A;
            --text-muted: #64748B;
            --shadow-glass: 0 8px 32px 0 rgba(31, 38, 135, 0.08);
            --shadow-hover: 0 14px 40px 0 rgba(37, 99, 235, 0.18);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Be Vietnam Pro', system-ui, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 60px;
            min-height: 100vh;
        }

        /* Top Navigation Bar dạng Glassmorphism */
        .top-navbar {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 14px 28px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
        }

        .nav-container {
            max-width: 1150px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .brand-icon {
            background: linear-gradient(135deg, var(--primary), var(--accent-purple));
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
        }

        .brand-text h1 {
            font-size: 1.2rem;
            font-weight: 800;
            color: #1E3A8A;
            letter-spacing: -0.3px;
        }

        .brand-text p {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
        }

        .nav-badges {
            display: flex;
            gap: 12px;
        }

        .badge-item {
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(8px);
        }

        .badge-kt {
            background: rgba(224, 231, 255, 0.8);
            color: #3730A3;
            border: 1px solid #C7D2FE;
        }

        .badge-rank {
            background: rgba(254, 243, 199, 0.8);
            color: #B45309;
            border: 1px solid #FDE68A;
        }

        /* Container Chính */
        .main-container {
            max-width: 1150px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* Khung Thông tin Học Sinh (Glassmorphism) */
        .user-info-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 20px 28px;
            box-shadow: var(--shadow-glass);
            border: 1px solid var(--glass-border);
            margin-bottom: 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 18px;
        }

        .user-profile-display {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-avatar-icon {
            width: 50px;
            height: 50px;
            border-radius: 16px;
            background: linear-gradient(135deg, #FEF3C7, #FDE68A);
            color: #D97706;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            box-shadow: 0 4px 12px rgba(217, 119, 6, 0.15);
        }

        .user-status-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .user-status-name {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .user-input-form {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .input-style {
            padding: 12px 20px;
            border-radius: 30px;
            border: 1.5px solid rgba(203, 213, 225, 0.8);
            outline: none;
            font-size: 0.92rem;
            background: rgba(255, 255, 255, 0.9);
            transition: all 0.25s;
        }

        .input-style:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
            background: #FFFFFF;
        }

        .input-name { width: 240px; }
        .input-class { width: 95px; text-align: center; }

        .btn-save-user {
            background: linear-gradient(135deg, #2563EB, #4F46E5);
            color: white;
            border: none;
            padding: 12px 26px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.92rem;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(37, 99, 235, 0.3);
            transition: all 0.25s;
        }

        .btn-save-user:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(37, 99, 235, 0.4);
        }

        /* Hero Banner Hiện Đại */
        .hero-banner {
            background: linear-gradient(135deg, #4338CA 0%, #2563EB 50%, #0284C7 100%);
            border-radius: 24px;
            padding: 40px 48px;
            color: white;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px -15px rgba(67, 56, 202, 0.45);
            margin-bottom: 36px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 640px;
        }

        .hero-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.82rem;
            font-weight: 700;
            margin-bottom: 14px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .hero-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 12px;
            line-height: 1.25;
            letter-spacing: -0.5px;
        }

        .hero-desc {
            font-size: 0.98rem;
            opacity: 0.92;
            line-height: 1.6;
        }

        .hero-bg-icon {
            position: absolute;
            right: 30px;
            bottom: -20px;
            font-size: 11rem;
            opacity: 0.18;
            pointer-events: none;
            transform: rotate(-10deg);
        }

        /* Danh mục Chủ đề & Thẻ Bài Học */
        .topic-group {
            margin-bottom: 36px;
        }

        .topic-header {
            font-size: 1.25rem;
            font-weight: 800;
            color: #1E3A8A;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .topic-pill {
            width: 10px;
            height: 26px;
            background: linear-gradient(180deg, var(--primary), var(--accent-purple));
            border-radius: 6px;
        }

        .lessons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .lesson-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 24px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-glass);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .lesson-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover);
            border-color: rgba(37, 99, 235, 0.4);
            background: rgba(255, 255, 255, 0.95);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .lesson-num-badge {
            background: rgba(224, 231, 255, 0.9);
            color: #3730A3;
            font-size: 0.8rem;
            font-weight: 800;
            padding: 5px 14px;
            border-radius: 30px;
            border: 1px solid #C7D2FE;
        }

        .card-icon {
            font-size: 1.3rem;
            opacity: 0.7;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .card-subtitle {
            font-size: 0.86rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.5;
        }

            justify-
