<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CÙNG HỌC TIN HỌC 9 - TRƯỜNG THCS PHÚ ĐÌNH</title>
    <!-- Font Inter & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #1E40AF;
            --primary-dark: #1E3A8A;
            --primary-light: #3B82F6;
            --accent: #F59E0B;
            --bg-gradient: linear-gradient(135deg, #f0f4f9 0%, #e2eaf4 100%);
            --card-bg: #FFFFFF;
            --text-main: #1E293B;
            --text-muted: #64748B;
            --border-color: #E2E8F0;
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.02);
            --shadow-md: 0 10px 25px -5px rgba(30, 64, 175, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            --shadow-hover: 0 20px 25px -5px rgba(30, 64, 175, 0.15), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            /* Background chuyên nghiệp với họa tiết hạt mạng lưới công nghệ nhẹ */
            background-color: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(30, 64, 175, 0.08) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(245, 158, 11, 0.05) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 60px;
            min-height: 100vh;
        }

        /* Top Header Navigation */
        .top-navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 12px 24px;
            box-shadow: var(--shadow-sm);
        }

        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .brand-icon {
            background: linear-gradient(135deg, #2563EB, #1D4ED8);
            color: white;
            width: 42px;
            height: 42px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
        }

        .brand-text h1 {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--primary-dark);
            letter-spacing: -0.5px;
            line-height: 1.2;
        }

        .brand-text p {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .nav-badges {
            display: flex;
            gap: 10px;
        }

        .badge-item {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge-kt {
            background: #EFF6FF;
            color: #1D4ED8;
            border: 1px solid #BFDBFE;
        }

        .badge-rank {
            background: #FEF3C7;
            color: #D97706;
            border: 1px solid #FDE68A;
        }

        /* Container chính */
        .main-container {
            max-width: 1100px;
            margin: 25px auto;
            padding: 0 20px;
        }

        /* Form Nhập thông tin Học sinh */
        .user-info-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 18px 24px;
            box-shadow: var(--shadow-md);
            border: 1px solid rgba(226, 232, 240, 0.8);
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .user-profile-display {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .user-avatar-icon {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: #FEF3C7;
            color: #D97706;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .user-status-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .user-status-name {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .user-input-form {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .input-style {
            padding: 10px 16px;
            border-radius: 25px;
            border: 1.5px solid var(--border-color);
            outline: none;
            font-size: 0.9rem;
            transition: all 0.2s;
            background: #F8FAFC;
        }

        .input-style:focus {
            border-color: var(--primary-light);
            background: white;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .input-name { width: 220px; }
        .input-class { width: 90px; text-align: center; }

        .btn-save-user {
            background: linear-gradient(135deg, #2563EB, #1D4ED8);
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
            transition: all 0.2s;
        }

        .btn-save-user:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(37, 99, 235, 0.35);
        }

        /* Hero Banner Tím hiện đại */
        .hero-banner {
            background: linear-gradient(135deg, #4F46E5 0%, #3B82F6 100%);
            border-radius: 20px;
            padding: 35px 40px;
            color: white;
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 30px -10px rgba(79, 70, 229, 0.4);
            margin-bottom: 30px;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 600px;
        }

        .hero-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .hero-title {
            font-size: 1.85rem;
            font-weight: 800;
            margin-bottom: 10px;
            line-height: 1.25;
            letter-spacing: -0.5px;
        }

        .hero-desc {
            font-size: 0.95rem;
            opacity: 0.9;
            line-height: 1.5;
        }

        .hero-controller-icon {
            position: absolute;
            right: 30px;
            bottom: -15px;
            font-size: 11rem;
            opacity: 0.22;
            transform: rotate(-12deg);
            pointer-events: none;
        }

        /* Danh mục Chủ đề & Thẻ bài học */
        .topic-group {
            margin-bottom: 32px;
        }

        .topic-header {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--primary-dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .topic-pill {
            width: 8px;
            height: 24px;
            background: var(--primary-light);
            border-radius: 4px;
        }

        .lessons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
            gap: 18px;
        }

        .lesson-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .lesson-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
            border-color: #93C5FD;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .lesson-num-badge {
            background: #EFF6FF;
            color: #1D4ED8;
            font-size: 0.78rem;
            font-weight: 800;
            padding: 4px 12px;
            border-radius: 20px;
        }

        .lesson-gear-icon {
            color: #94A3B8;
            font-size: 1.1rem;
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .card-subtitle {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 18px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 14px;
            border-top: 1px dashed var(--border-color);
        }

        .question-count-tag {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-start-quiz {
            color: var(--primary-light);
            font-weight: 700;
            font-size: 0.88rem;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: gap 0.2s;
        }

        .btn-start-quiz:hover {
            gap: 10px;
            color: var(--primary);
        }
    </style>
</head>
