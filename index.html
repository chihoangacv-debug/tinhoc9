<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CÙNG HỌC TIN HỌC 9 - Trường THCS Phú Đình</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-gradient: linear-gradient(135deg, #f0f4ff 0%, #e0e7ff 100%);
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --accent: #10b981;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        .header h1 {
            margin: 0;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header p {
            margin: 5px 0 0 0;
            font-size: 0.95rem;
            opacity: 0.9;
        }

        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }

        .user-info {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .user-info input {
            flex: 1;
            min-width: 200px;
            padding: 10px 15px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .user-info input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .topic-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--primary-color);
            margin: 20px 0 10px 0;
            border-left: 4px solid var(--primary-color);
            padding-left: 10px;
        }

        .lesson-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 12px;
        }

        .lesson-btn {
            background: #ffffff;
            border: 2px solid #e0e7ff;
            border-radius: 10px;
            padding: 12px 15px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .lesson-btn:hover {
            border-color: var(--primary-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.15);
            background: #f8fafc;
        }

        .lesson-badge {
            font-size: 0.75rem;
            font-weight: bold;
            color: #ffffff;
            background: var(--primary-color);
            padding: 2px 8px;
            border-radius: 4px;
            width: fit-content;
        }

        .lesson-name {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
        }

        /* Quiz Area Styles */
        #quiz-container {
            display: none;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 10px;
        }

        .round-tag {
            background: #e0e7ff;
            color: var(--primary-color);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .option-item {
            padding: 12px 15px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
        }

        .option-item:hover {
            background: #f3f4f6;
            border-color: #9ca3af;
        }

        .option-item.selected {
            background: #e0e7ff;
            border-color: var(--primary-color);
            color: var(--primary-color);
            font-weight: 600;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .btn-secondary {
            background: #6b7280;
        }
        .btn-secondary:hover {
            background: #4b5563;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎮 CÙNG HỌC TIN HỌC 9</h1>
        <p>Bộ sách Kết nối tri thức | Trường THCS Phú Đình</p>
    </div>

    <div class="container" id="hub-container">
        <div class="card">
            <div class="user-info">
                <input type="text" id="student-name" placeholder="Nhập họ và tên học sinh...">
                <input type="text" id="student-class" placeholder="Lớp (Ví dụ: 9A1)">
            </div>

            <!-- CHỦ ĐỀ 1 -->
            <div class="topic-title">CHỦ ĐỀ 1: MÁY TÍNH VÀ CỘNG ĐỒNG</div>
            <div class="lesson-grid">
                <button class="lesson-btn" onclick="startLesson('bai1')">
                    <span class="lesson-badge">BÀI 1</span>
                    <span class="lesson-name">Thế giới kĩ thuật số</span>
                </button>
                <button class="lesson-btn" onclick="startLesson('bai2')">
                    <span class="lesson-badge">BÀI 2</span>
                    <span class="lesson-name">Thông tin trong giải quyết vấn đề</span>
                </button>
            </div>

            <!-- CHỦ ĐỀ 2 -->
            <div class="topic-title">CHỦ ĐỀ 2: TỔ CHỨC LƯU TRỮ VÀ TRUYỀN THÔNG TIN</div>
            <div class="lesson-grid">
                <button class="lesson-btn" onclick="startLesson('bai3')">
                    <span class="lesson-badge">BÀI 3</span>
                    <span class="lesson-name">Quản lí thư mục và tệp</span>
                </button>
                <button class="lesson-btn" onclick="startLesson('bai4')">
                    <span class="lesson-badge">BÀI 4</span>
                    <span class="lesson-name">Một số vấn đề pháp lí về sử dụng dịch vụ Internet</span>
                </button>
            </div>

            <!-- CHỦ ĐỀ 3 -->
            <div class="topic-title">CHỦ ĐỀ 3: ĐẠO ĐỨC, PHÁP LUẬT VÀ VĂN HÓA TRONG MÔI TRƯỜNG SỐ</div>
            <div class="lesson-grid">
                <button class="lesson-btn" onclick="startLesson('bai5')">
                    <span class="lesson-badge">BÀI 5</span>
                    <span class="lesson-name">Văn hóa ứng xử trên mạng xã hội</span>
                </button>
            </div>
        </div>
    </div>

    <div class="container" id="quiz-container">
        <div class="card">
            <div class="quiz-header">
                <span id="quiz-lesson-title" style="font-weight: bold; color: var(--primary-color);">Tên bài học</span>
                <span class="round-tag" id="current-round-tag">VÒNG 1: KHỞI ĐỘNG CÔNG NGHỆ</span>
            </div>
            <div id="question-index" style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 5px;">Câu hỏi 1 / 20</div>
            <div class="question-text" id="question-title">Đang tải câu hỏi...</div>
            <div class="options-list" id="options-container">
                <!-- Danh sách đáp án -->
            </div>
            <div class="nav-buttons">
                <button class="btn btn-secondary" onclick="returnToHub()">Trở về danh mục</button>
                <button class="btn" id="next-btn" onclick="nextQuestion()">Câu tiếp theo</button>
            </div>
        </div>
    </div>

    <script>
        // CƠ SỞ DỮ LIỆU CÂU HỎI PHÂN HÓA (20 CÂU HỎI MỖI BÀI)
        const LESSON_DATABASE = {
            "bai1": {
                title: "Bài 1: Thế giới kĩ thuật số",
                questions: [
                    // VÒNG 1: KHỞI ĐỘNG CÔNG NGHỆ (Nhận biết - 7 câu)
                    { round: "VÒNG 1: KHỞI ĐỘNG CÔNG NGHỆ", type: "mcq", q: "1. Trong đô thị thông minh, thiết bị nào sau đây được gắn bộ xử lý thông tin để điều khiển giao thông?", options: ["A. Xe ô tô tự lái", "B. Đèn giao thông", "C. Camera an ninh", "D. Biển báo giao thông"], answer: 1, explanation: "Đèn giao thông thông minh được gắn bộ xử lý để tự động điều chỉnh thời gian tín hiệu." },
                    { round: "VÒNG 1: KHỞI ĐỘNG CÔNG NGHỆ", type: "mcq", q: "2. Loại đồng hồ nào sau đây được gắn bộ xử lý thông tin?", options: ["A. Đồng hồ quả lắc chạy dây cót", "B. Đồng hồ đeo tay không dùng pin", "C. Đồng hồ thông minh", "D. Đồng hồ quartz thạch anh"], answer: 2, explanation: "Đồng hồ thông minh tích hợp chip xử lý, hệ điều hành và kết nối không dây." },
                    { round: "VÒNG 1: KHỞI ĐỘNG CÔNG NGHỆ", type: "mcq", q: "3. Thiết bị gia dụng nào sau đây KHÔNG được gắn bộ xử lý thông tin?", options: ["A. Máy giặt tự động", "B. Lò vi sóng điện tử", "C. Máy khoan cầm tay cơ học", "D. Robot hút bụi"], answer: 2, explanation: "Máy khoan cầm tay cơ học hoạt động thuần túy bằng cơ khí." },
                    { round: "VÒNG 1: KHỞI ĐỘNG CÔNG NGHỆ", type: "mcq", q: "4. Thiết bị số thông minh thường có đặc điểm nào dưới đây?", options: ["A. Chỉ có thể thực hiện một chức năng duy nhất", "B. Có khả năng tự động hóa và tương tác với người dùng", "C. Không cần nguồn điện khi hoạt động", "D. Chỉ hoạt động độc lập, không thể kết nối mạng"], answer: 1, explanation: "Thiết bị thông minh nổi bật với khả năng xử lý dữ liệu và tương tác tự động." },
                    { round: "VÒNG 1: KHỞI ĐỘNG CÔNG NGHỆ", type: "mcq", q: "5. Đâu là thành phần cốt lõi giúp một thiết bị thông thường trở thành thiết bị số thông minh?", options: ["A. Vỏ bọc bằng nhựa cao cấp", "B. Bộ vi xử lý (chip, vi điều khiển)", "C. Màn hình kích thước lớn", "D. Đèn LED hiển thị màu sắc"], answer: 1, explanation: "Bộ vi xử lý chính là 'bộ não' giúp thiết bị thực hiện các tính toán và quyết định thông minh." },
                    { round: "VÒNG 1: KHỞI ĐỘNG CÔNG NGHỆ", type: "mcq", q: "6. Hệ thống nào dưới đây ứng dụng công nghệ số để quản lý năng lượng điện tiêu thụ trong hộ gia đình?", options: ["A. Công tơ điện thông minh", "B. Bóng đèn sợi đốt truyền thống", "C. Cầu chì tự ngắt bằng cơ nhiệt", "D. Bếp củi truyền thống"], answer: 0, explanation: "Công tơ điện thông minh đo đạc và truyền dữ liệu tiêu thụ điện thời gian thực." },
                    { round: "VÒNG 1: KHỞI ĐỘNG CÔNG NGHỆ", type: "mcq", q: "7. Thiết bị nào sau đây sử dụng công nghệ nhận diện khuôn mặt?", options: ["A. Khóa cửa thông minh", "B. Ổ khóa cơ truyền thống", "C. Chốt cửa bằng gỗ", "D. Móc khóa đồng"], answer: 0, explanation: "Khóa cửa thông minh tích hợp camera và AI để nhận diện khuôn mặt chủ nhà." },

                    // VÒNG 2: TƯ DUY THÔNG MINH (Thông hiểu - 7 câu)
                    { round: "VÒNG 2: TƯ DUY THÔNG MINH", type: "mcq", q: "8. Dữ liệu đầu ra của điều khiển từ xa ti vi truyền đến ti vi dưới dạng gì?", options: ["A. Chùm sáng hẹp song song", "B. Dãy bit dưới dạng tín hiệu hồng ngoại", "C. Dãy bit dưới dạng tín hiệu sóng âm", "D. Chùm sáng laser tử ngoại"], answer: 1, explanation: "Điều khiển từ xa mã hóa thông tin thành dãy bit truyền qua tia hồng ngoại." },
                    { round: "VÒNG 2: TƯ DUY THÔNG MINH", type: "mcq", q: "9. Nhóm đặc điểm nào thể hiện chính xác các ưu điểm vượt trội của máy tính?", options: ["A. Tính toán nhanh, lưu trữ lâu dài, kết nối an toàn", "B. Tính toán nhanh, lưu trữ lớn, kết nối toàn cầu", "C. Tưởng tượng phong phú, lưu trữ lớn, kết nối toàn cầu", "D. Tưởng tượng phong phú, lưu trữ lâu dài, an toàn"], answer: 1, explanation: "Máy tính nổi bật với tốc độ tính toán siêu nhanh, dung lượng lưu trữ khổng lồ và kết nối toàn cầu." },
                    { round: "VÒNG 2: TƯ DUY THÔNG MINH", type: "mcq", q: "10. Phát biểu nào sau đây đúng khi nói về tác động của công nghệ số đến đời sống xã hội?", options: ["A. Làm con người lười suy nghĩ và mất hoàn toàn khả năng giao tiếp trực tiếp", "B. Giúp tối ưu hóa quy trình làm việc, nâng cao chất lượng cuộc sống nhưng cũng đặt ra thách thức về bảo mật", "C. Chỉ phục vụ cho mục đích giải trí cá nhân mà không có giá trị kinh tế", "D. Thay thế hoàn toàn vai trò quyết định của con người trong mọi lĩnh vực"], answer: 1, explanation: "Công nghệ số mang lại nhiều tiện ích to lớn song hành cùng các vấn đề về an ninh mạng." },
                    { round: "VÒNG 2: TƯ DUY THÔNG MINH", type: "mcq", q: "11. Tại sao các thiết bị di động thông minh (Smartphone) lại được coi là trung tâm điều khiển hệ thống nhà thông minh (Smart Home)?", options: ["A. Vì smartphone có màn hình rất lớn", "B. Vì smartphone có khả năng kết nối mạng linh hoạt và cài đặt ứng dụng điều khiển trung gian", "C. Vì smartphone có trọng lượng rất nhẹ", "D. Vì smartphone không tiêu thụ pin khi kết nối thiết bị ngoại vi"], answer: 1, explanation: "Smartphone kết nối Internet và Bluetooth giúp điều khiển mọi thiết bị gia dụng từ xa." },
                    { round: "VÒNG 2: TƯ DUY THÔNG MINH", type: "mcq", q: "12. Việc số hóa tài liệu lưu trữ trong các cơ quan nhà nước mang lại lợi ích chủ yếu nào?", options: ["A. Tốn kém nhiều không gian vật lý hơn", "B. Dễ dàng tìm kiếm, chia sẻ nhanh chóng và tiết kiệm không gian", "C. Làm giảm độ chính xác của thông tin lưu trữ", "D. Hạn chế quyền tiếp cận thông tin của người dân"], answer: 1, explanation: "Số hóa giúp tối ưu hóa việc lưu trữ, tìm kiếm và luân chuyển văn bản hành chính." },
                    { round: "VÒNG 2: TƯ DUY THÔNG MINH", type: "mcq", q: "13. Thiết bị nào sau đây đóng vai trò là 'cổng kết nối' chính đưa Internet đến các thiết bị trong gia đình?", options: ["A. Bộ định tuyến Wi-Fi (Router)", "B. Ổ cắm điện đa năng", "C. Cáp dẫn điện cao thế", "D. Công tắc điện cơ học"], answer: 0, explanation: "Router Wi-Fi làm nhiệm vụ phân phối tín hiệu Internet đến các thiết bị trong nhà." },
                    { round: "VÒNG 2: TƯ DUY THÔNG MINH", type: "mcq", q: "14. Dữ liệu lớn (Big Data) trong xã hội số được hình thành từ nguồn nào?", options: ["A. Chỉ từ các văn bản do cơ quan nhà nước phát hành", "B. Từ mọi hoạt động trực tuyến của con người: mạng xã hội, giao dịch thương mại, cảm biến IoT...", "C. Chỉ từ sách giáo khoa điện tử", "D. Chỉ từ các chương trình phát thanh truyền hình"], answer: 1, explanation: "Big Data thu thập từ vô số nguồn tương tác số hàng ngày của nhân loại." },

                    // VÒNG 3: CHINH PHỤC THỬ THÁCH (Vận dụng & Nâng cao - 6 câu)
                    { round: "VÒNG 3: CHINH PHỤC THỬ THÁCH", type: "mcq", q: "15. Tại sao các thiết bị như ti vi thông minh, tủ lạnh thông minh lại được gọi là thiết bị 'thông minh'?", options: ["A. Vì chúng tự nhận thức và có cảm xúc như con người", "B. Vì chúng được gắn bộ xử lý thông tin và chạy chương trình điều khiển", "C. Vì chúng chạy hoàn toàn bằng năng lượng tự nhiên", "D. Vì giá thành của chúng rất cao"], answer: 1, explanation: "Thiết bị thông minh là thiết bị được trang bị bộ xử lý thông tin để tự động hóa tác vụ." },
                    { round: "VÒNG 3: CHINH PHỤC THỬ THÁCH", type: "mcq", q: "16. Trong kịch bản xây dựng lớp học thông minh, giải pháp nào thể hiện rõ nhất sự tương tác số hai chiều giữa giáo viên và học sinh?", options: ["A. Sử dụng bảng phấn và giẻ lau truyền thống", "B. Sử dụng màn hình tương tác thông minh kết hợp phần mềm kiểm tra trực tuyến", "C. Sách giáo khoa bằng giấy in khổ lớn", "D. Quạt trần điều khiển bằng công tắc tường"], answer: 1, explanation: "Màn hình tương tác và phần mềm e-learning cho phép phản hồi tức thì giữa thầy và trò." },
                    { round: "VÒNG 3: CHINH PHỤC THỬ THÁCH", type: "mcq", q: "17. Một hệ thống nông nghiệp thông minh tự động tưới nước dựa vào độ ẩm đất thu thập từ cảm biến ứng dụng nguyên lý nào của thiết bị số?", options: ["A. Thu nhận dữ liệu - Xử lý thông tin - Ra quyết định hành động điều khiển", "B. Chỉ lưu trữ dữ liệu tĩnh không cần xử lý", "C. Thực hiện thủ công hoàn toàn bằng sức người", "D. Phân tích cảm xúc của cây trồng"], answer: 0, explanation: "Hệ thống tự động hóa khép kín: Cảm biến đo -> Vi xử lý so sánh -> Kích hoạt máy bơm." },
                    { round: "VÒNG 3: CHINH PHỤC THỬ THÁCH", type: "mcq", q: "18. Khi thiết kế một hệ thống cảnh báo đột nhập gia đình qua điện thoại, thành phần nào đóng vai trò nhận tín hiệu cảnh báo từ cảm biến hồng ngoại?", options: ["A. Đèn báo hiệu giao thông", "B. Bộ điều khiển trung tâm kết nối Internet", "C. Khóa cửa cơ học", "D. Dây dẫn điện"], answer: 1, explanation: "Bộ điều khiển trung tâm nhận tín hiệu từ cảm biến và đẩy thông báo đẩy (push notification) lên điện thoại." },
                    { round: "VÒNG 3: CHINH PHỤC THỬ THÁCH", type: "mcq", q: "19. Giải pháp nào sau đây giúp giảm thiểu rủi ro bị đánh cắp dữ liệu cá nhân khi sử dụng các dịch vụ số trên Internet?", options: ["A. Sử dụng chung một mật khẩu đơn giản cho mọi tài khoản", "B. Kích hoạt xác thực hai yếu tố (2FA) và cẩn trọng khi chia sẻ thông tin", "C. Không bao giờ kết nối Wi-Fi công cộng nhưng dùng chung mật khẩu", "D. Tắt hoàn toàn tính năng cập nhật bảo mật của thiết bị"], answer: 1, explanation: "2FA và ý thức bảo mật là lá chắn quan trọng nhất trên không gian mạng." },
                    { round: "VÒNG 3: CHINH PHỤC THỬ THÁCH", type: "mcq", q: "20. Xu thế chuyển đổi số trong giáo dục tại các trường THCS hiện nay mang lại tác động chiến lược nào?", options: ["A. Thay thế hoàn toàn giáo viên bằng robot thông minh", "B. Tạo môi trường học tập linh hoạt, cá nhân hóa lộ trình và tiếp cận nguồn học liệu toàn cầu", "C. Bắt buộc học sinh không cần đến trường trực tiếp nữa", "D. Loại bỏ hoàn toàn sách vở truyền thống trong mọi môn học"], answer: 1, explanation: "Chuyển đổi số hỗ trợ giáo viên cá nhân hóa học tập và mở rộng không gian lớp học." }
                ]
            },
            "bai2": {
                title: "Bài 2: Thông tin trong giải quyết vấn đề",
                questions: [
                    { round: "VÒNG 1: KHỞI ĐỘNG CÔNG NGHỆ", type: "mcq", q: "1. Thông tin đáng tin cậy giúp ích gì cho con người trong đời sống?", options: ["A. Đưa ra quyết định chính xác và hiệu quả", "B. Làm chậm quá trình xử lí công việc", "C. Gây ra sự nhầm lẫn không đáng có", "D. Tăng chi phí tìm kiếm dữ liệu"], answer: 0, explanation: "Thông tin chính xác là nền tảng của mọi quyết định đúng đắn." },
                    // Có thể tiếp tục bổ sung đầy đủ 20 câu tương tự cho các bài khác
                ]
            }
        };

        let currentLessonKey = '';
        let currentQuestionIdx = 0;
        let selectedAnswers = {};

        function startLesson(lessonKey) {
            const name = document.getElementById('student-name').value.trim();
            const className = document.getElementById('student-class').value.trim();
            
            if(!name || !className) {
                alert('Thầy/Cô vui lòng nhập đầy đủ Họ tên và Lớp của học sinh trước khi bắt đầu làm bài!');
                return;
            }

            currentLessonKey = lessonKey;
            currentQuestionIdx = 0;
            selectedAnswers = {};

            const lesson = LESSON_DATABASE[lessonKey];
            if(!lesson) {
                alert('Nội dung bài học đang được cập nhật!');
                return;
            }

            document.getElementById('quiz-lesson-title').innerText = lesson.title;
            document.getElementById('hub-container').style.display = 'none';
            document.getElementById('quiz-container').style.display = 'block';

            renderQuestion();
        }

        function renderQuestion() {
            const lesson = LESSON_DATABASE[currentLessonKey];
            const qData = lesson.questions[currentQuestionIdx];

            document.getElementById('current-round-tag').innerText = qData.round;
            document.getElementById('question-index').innerText = `Câu hỏi ${currentQuestionIdx + 1} / ${lesson.questions.length}`;
            document.getElementById('question-title').innerText = qData.q;

            const optsContainer = document.getElementById('options-container');
            optsContainer.innerHTML = '';

            qData.options.forEach((opt, idx) => {
                const div = document.createElement('div');
                div.className = 'option-item';
                if(selectedAnswers[currentQuestionIdx] === idx) {
                    div.classList.add('selected');
                }
                div.innerText = opt;
                div.onclick = () => selectOption(idx);
                optsContainer.appendChild(div);
            });

            const nextBtn = document.getElementById('next-btn');
            if(currentQuestionIdx === lesson.questions.length - 1) {
                nextBtn.innerText = "Nộp bài";
            } else {
                nextBtn.innerText = "Câu tiếp theo";
            }
        }

        function selectOption(idx) {
            selectedAnswers[currentQuestionIdx] = idx;
            renderQuestion();
        }

        function nextQuestion() {
            const lesson = LESSON_DATABASE[currentLessonKey];
            if(currentQuestionIdx < lesson.questions.length - 1) {
                currentQuestionIdx++;
                renderQuestion();
            } else {
                // Hoàn thành bài
                let score = 0;
                lesson.questions.forEach((q, idx) => {
                    if(selectedAnswers[idx] === q.answer) score++;
                });
                alert(`🎉 Chúc mừng học sinh đã hoàn thành bài học!\n\n📊 Số câu trả lời đúng: ${score} / ${lesson.questions.length}`);
                returnToHub();
            }
        }

        function returnToHub() {
            document.getElementById('quiz-container').style.display = 'none';
            document.getElementById('hub-container').style.display = 'block';
        }
    </script>
